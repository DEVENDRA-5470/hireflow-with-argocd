name: Build Push and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: hireflow-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: devendra-5470
  GITOPS_REPO: DEVENDRA-5470/hireflow-gitops

jobs:

  docker:
    name: Build and push images
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Print published images
        run: |
          echo "============================================"
          echo "GHCR IMAGES PUBLISHED"
          echo "============================================"
          echo "Backend:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-backend:${{ github.sha }}"
          echo ""
          echo "Frontend:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/hireflow-frontend:${{ github.sha }}"
          echo ""
          echo "Commit:"
          echo "${{ github.sha }}"

  update-gitops:

    name: Update GitOps image tags
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitOps repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Update backend image
        run: |
          sed -i \
            "s|image: ghcr.io/devendra-5470/hireflow-backend:.*|image: ghcr.io/devendra-5470/hireflow-backend:${{ needs.docker.outputs.image_tag }}|" \
            gitops/k8s/backend-deployment.yaml

      - name: Update frontend image
        run: |
          sed -i \
            "s|image: ghcr.io/devendra-5470/hireflow-frontend:.*|image: ghcr.io/devendra-5470/hireflow-frontend:${{ needs.docker.outputs.image_tag }}|" \
            gitops/k8s/frontend-deployment.yaml

      - name: Commit and push GitOps changes
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend-deployment.yaml
          git add k8s/frontend-deployment.yaml

          git diff --cached --quiet && exit 0

          git commit -m "Deploy images for ${{ needs.docker.outputs.image_tag }}"
          git push origin main
